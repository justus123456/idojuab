[build]
  publish = "."

[[edge_functions]]
  path = "/api/contact"
  function = "contact"

[[edge_functions]]
  path = "/api/admin-invite-request"
  function = "admin-invite-request"

[[edge_functions]]
  path = "/api/admin-invite-verify"
  function = "admin-invite-verify"

[[redirects]]
  from = "/signup"
  to = "/login.html"
  status = 302
  force = true

[[redirects]]
  from = "/signup.html"
  to = "/login.html"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://wkknfeknvunhugrabvpl.supabase.co https://www.google-analytics.com; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
