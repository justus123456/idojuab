<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Onboarding</title>
        <link rel="stylesheet" href="fonts/css/all.css">
        <link rel="stylesheet" href="css/login.css">
        <link rel="shortcut icon" href="images/Laundry Logo design template - Made with PosterMyWall.png" type="image/x-icon">
    </head>
    <body>
        <section>
            <div class="login-container signup-container">
                <h2>Set Up Admin Account</h2>
                <p class="helper-text">Enter the email that received the invite, the 6-digit code, and a new password.</p>
                <form id="admin-onboarding-form">
                    <div class="form-group">
                        <label for="onboarding-email">Email</label>
                        <input type="email" id="onboarding-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="otp">One-Time Code</label>
                        <input type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" name="password" required>
                        <small>Minimum 8 characters with uppercase, lowercase, number, and special character.</small>
                    </div>
                    <button type="submit">Create Admin Account</button>
                    <p id="onboarding-message" style="display: none;"></p>
                </form>
                <p class="helper-links">
                    <a href="login.html">Back to login</a>
                </p>
            </div>
        </section>
        <script src="admin-onboarding.js" defer></script>
    </body>
</html>
